name: Windows checks and VSIX build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify embedded collector
        run: python -B packaging/sync-local-collector.py --check
      - name: JavaScript regression checks
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests -Filter '*.js' | Where-Object { $_.Name -ne 'tls-runtime-smoke.js' } | ForEach-Object { $_.FullName }
          node --test --experimental-test-isolation=none $tests
          exit $LASTEXITCODE
      - name: Python collector checks
        run: python -B tests/remote-collector.py
      - name: Packaging checks
        run: python -B tests/package-validation.py
      - name: Settings helper checks
        run: python -B test-configuration.py
      - name: Build VSIX packages
        run: python -B build.py --output dist
      - name: Upload VSIX packages
        uses: actions/upload-artifact@v4
        with:
          name: codex-beacon-vsix
          path: dist/*.vsix
          if-no-files-found: error
